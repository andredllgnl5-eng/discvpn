<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shivi Star — Transmissão</title><style>:root{font-family:Inter,Segoe UI,sans-serif;color:#f7f8ff;background:#060a13;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#28398b55,transparent 45%),#060a13}.wrap{width:min(1280px,96vw);text-align:center}h1{font-size:22px;margin:0 0 8px}.status{color:#9eabc9;margin-bottom:18px}video{display:block;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #273252;border-radius:16px;box-shadow:0 24px 80px #0008;object-fit:contain}.hint{font-size:12px;color:#73809f;margin-top:14px}</style></head><body><main class="wrap"><h1>Transmissão de tela</h1><div id="status" class="status">Conectando à transmissão…</div><video id="video" autoplay playsinline controls></video><div class="hint">Compartilhamento direto WebRTC • 720p 60 FPS • Feito por Shivi Star</div></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>const status=document.getElementById('status'),video=document.getElementById('video'),host=new URLSearchParams(location.search).get('watch');if(!host){status.textContent='Link de transmissão inválido.'}else{const peer=new Peer(undefined,{secure:true});peer.on('open',()=>{status.textContent='Aguardando vídeo…';const connection=peer.connect(host,{reliable:true});connection.on('error',error=>status.textContent='Falha na transmissão: '+error.message)});peer.on('call',call=>{call.answer();call.on('stream',stream=>{video.srcObject=stream;status.textContent='Ao vivo — 1280×720 a 60 FPS';video.play().catch(()=>{})});call.on('close',()=>status.textContent='A transmissão foi encerrada.');call.on('error',error=>status.textContent='Falha na transmissão: '+error.message)});peer.on('error',error=>status.textContent='Não foi possível conectar: '+error.message)}</script></body></html>
