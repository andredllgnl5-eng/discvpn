<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shivi Star — Transmissão</title>
  <style>
    :root{font-family:Inter,Segoe UI,sans-serif;color:#f7f8ff;background:#060a13;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#28398b55,transparent 45%),#060a13}
    .wrap{width:min(1280px,96vw);text-align:center}
    h1{font-size:22px;margin:0 0 8px}
    .status{color:#9eabc9;margin-bottom:18px}
    video{display:block;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #273252;border-radius:16px;box-shadow:0 24px 80px #0008;object-fit:contain}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
    button{padding:10px 16px;border:1px solid #5063a8;border-radius:10px;background:#263971;color:#fff;font:inherit;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .hidden{display:none}
    .hint{font-size:12px;color:#9eabc9;margin-top:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Transmissão de tela</h1>
    <div id="status" class="status" role="status">Conectando à transmissão…</div>
    <video id="video" autoplay muted playsinline controls></video>
    <div class="actions">
      <button id="fullscreen" type="button" disabled>Tela cheia</button>
      <button id="audio" type="button" disabled>Áudio indisponível</button>
      <button id="retry" type="button" class="hidden">Tentar novamente</button>
    </div>
    <div id="audio-hint" class="hint">Aguardando informações de áudio…</div>
    <div class="hint">Compartilhamento direto WebRTC • 720p 60 FPS • Feito por Shivi Star</div>
  </main>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
    const status = document.getElementById('status');
    const video = document.getElementById('video');
    const audio = document.getElementById('audio');
    const fullscreen = document.getElementById('fullscreen');
    const audioHint = document.getElementById('audio-hint');
    const retry = document.getElementById('retry');
    const host = new URLSearchParams(location.search).get('watch');
    let peer = null;
    let watchdog = null;
    let generation = 0;
    let retries = 0;
    let receivedFrame = false;

    async function playVideo() {
      try {
        await video.play();
        if (receivedFrame) status.textContent = 'Ao vivo — vídeo recebido';
      }
      catch (error) { status.textContent = 'Clique no vídeo para iniciar a reprodução.'; }
    }

    function updateAudio(stream) {
      const hasAudio = stream.getAudioTracks().some(track => track.readyState === 'live');
      audio.disabled = !hasAudio;
      audio.textContent = hasAudio ? 'Ativar áudio' : 'Áudio indisponível';
      audioHint.textContent = hasAudio
        ? 'O vídeo inicia sem som. Clique em “Ativar áudio” para ouvir.'
        : 'Quem transmite não incluiu áudio. É preciso marcar “Compartilhar áudio” no seletor do navegador, quando disponível.';
    }

    audio.addEventListener('click', async () => {
      video.muted = !video.muted;
      audio.textContent = video.muted ? 'Ativar áudio' : 'Desativar áudio';
      await playVideo();
    });
    fullscreen.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await video.requestFullscreen();
      } catch (error) { status.textContent = `Não foi possível abrir em tela cheia: ${error.message}`; }
    });
    document.addEventListener('fullscreenchange', () => {
      fullscreen.textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia';
    });
    video.addEventListener('click', () => { if (video.paused) playVideo(); });
    retry.addEventListener('click', () => { retries = 0; connect(); });

    function fail(message, current) {
      if (current !== generation || receivedFrame) return;
      clearTimeout(watchdog);
      if (retries < 1) {
        retries++;
        status.textContent = `${message} Reconectando uma vez…`;
        setTimeout(() => { if (current === generation) connect(); }, 1000);
      } else {
        status.textContent = `${message} Clique em “Tentar novamente”.`;
        retry.classList.remove('hidden');
      }
    }

    function connect() {
      const current = ++generation;
      clearTimeout(watchdog);
      peer?.destroy();
      peer = null;
      video.srcObject = null;
      video.muted = true;
      receivedFrame = false;
      fullscreen.disabled = true;
      audio.disabled = true;
      audio.textContent = 'Áudio indisponível';
      retry.classList.add('hidden');
      status.textContent = 'Conectando à transmissão…';
      watchdog = setTimeout(() => fail('O vídeo não chegou em 15 segundos.', current), 15000);
      peer = new Peer(undefined, { secure: true });
      peer.on('open', () => {
        if (current !== generation) return;
        status.textContent = 'Aguardando vídeo…';
        const connection = peer.connect(host, { reliable: true });
        connection.on('error', error => fail(`Falha na transmissão: ${error.message}.`, current));
      });
      peer.on('call', call => {
        if (current !== generation) { call.close(); return; }
        call.answer();
        call.on('stream', stream => {
          if (current !== generation) return;
          video.srcObject = stream;
          fullscreen.disabled = false;
          updateAudio(stream);
          stream.getAudioTracks().forEach(track => track.addEventListener('ended', () => updateAudio(stream)));
          status.textContent = 'Recebendo vídeo…';
          if (video.requestVideoFrameCallback) {
            video.requestVideoFrameCallback(() => {
              if (current !== generation) return;
              receivedFrame = true;
              clearTimeout(watchdog);
              status.textContent = 'Ao vivo — vídeo recebido';
            });
          } else {
            video.addEventListener('loadeddata', () => {
              if (current !== generation) return;
              receivedFrame = true;
              clearTimeout(watchdog);
              status.textContent = 'Ao vivo — vídeo recebido';
            }, { once: true });
          }
          playVideo();
        });
        call.on('close', () => {
          if (current !== generation) return;
          clearTimeout(watchdog);
          status.textContent = 'A transmissão foi encerrada.';
          retry.classList.remove('hidden');
        });
        call.on('error', error => fail(`Falha na transmissão: ${error.message}.`, current));
        call.peerConnection?.addEventListener('connectionstatechange', () => {
          if (call.peerConnection.connectionState === 'failed') fail('A conexão direta entre os navegadores falhou.', current);
        });
      });
      peer.on('error', error => fail(`Não foi possível conectar: ${error.message}.`, current));
    }

    if (!host) status.textContent = 'Link de transmissão inválido.';
    else connect();
  </script>
</body>
</html>
